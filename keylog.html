<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earl spike - focus test</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f6f6f4;
        color: #1c1c1c;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 10px;
      }
      #status {
        padding: 10px 12px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 10px;
      }
      #status.ok {
        background: #d9f2dc;
        color: #135c1d;
      }
      #status.lost {
        background: #fbd9d6;
        color: #8a1c12;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 110px;
        font: 14px Consolas, monospace;
        padding: 8px;
      }
      #counters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 16px;
        margin: 10px 0;
        font: 13px Consolas, monospace;
      }
      #log {
        height: 220px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid #ccc;
        padding: 6px 8px;
        font: 12px/1.4 Consolas, monospace;
        white-space: pre;
      }
      button {
        font: inherit;
        padding: 4px 12px;
      }
    </style>
  </head>
  <body>
    <h1>Focus test</h1>
    <p>Click in the box and keep typing. While you type, hover over Earl, click him and drag him. If Earl ever
      steals focus, the bar turns red and the log says so.</p>
    <div id="status" class="ok">This window has focus</div>
    <textarea id="typing" placeholder="Type here..." autofocus></textarea>
    <div id="counters"></div>
    <p><button id="reset" type="button">Reset counters</button></p>
    <div id="log"></div>
    <script type="module" src="/src/spike/keylog.ts"></script>
  </body>
</html>

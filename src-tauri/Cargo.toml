[package]
name = "earl-spike"
version = "0.0.1"
description = "Earl v2 M0.4 Windows platform spike (throwaway, never merged)"
authors = ["Cameron"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32 bindings (plan D33): same version tao already pulls in, so no second copy is built.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# Keep release symbols light but still debuggable if the spike crashes.
debug = 1

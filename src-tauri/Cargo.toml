[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "earl"
version = "1.0.0"
description = "Earl - Desktop Duckling Companion"
authors = ["Cameron"]
edition = "2021"

[lib]
name = "earl_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
earl-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
# Win32 bindings for the v2 platform layer. 0.61 is the version tao already
# pulls in, so this adds no second copy. Features are added by the units that
# use them.
windows = { version = "0.61", features = ["Win32_Foundation"] }
